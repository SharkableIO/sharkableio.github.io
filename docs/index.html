<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sharkable — Minimal API Framework for .NET</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Sharkable — A clean, powerful minimal API framework for .NET">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --primary: #0a6e75;
      --primary-light: #0d8a93;
      --primary-dark: #064e52;
      --primary-bg: #e8f4f5;
      --primary-ghost: #f0f8f9;
      --accent: #e85d2c;
      --accent-light: #fdf0ea;
      --text: #1e293b;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --sidebar-bg: #f8fafc;
      --sidebar-border: #e2e8f0;
      --sidebar-width: 300px;
      --content-max-width: 860px;
      --code-bg: #f1f4f8;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', 'PingFang SC', sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', 'Fira Mono', Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* === Language Switcher === */
    .app-nav {
      position: fixed;
      top: 16px;
      right: 28px;
      z-index: 100;
    }
    .app-nav a {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
      transition: all .2s;
      text-decoration: none;
      letter-spacing: .3px;
    }
    .app-nav a:hover { color: var(--primary); background: var(--primary-bg); }
    .app-nav a.active {
      color: #fff;
      background: var(--primary);
    }

    /* === Sidebar === */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      padding-top: 0;
    }
    .sidebar > h1 {
      padding: 20px 20px 14px;
      margin: 0;
      border-bottom: 1px solid var(--sidebar-border);
    }
    .sidebar > h1 .app-name-link {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-dark) !important;
      text-decoration: none;
    }
    .sidebar > h1 img {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      vertical-align: middle;
    }
    .sidebar-nav {
      padding: 4px 0 48px;
    }
    .sidebar-nav li {
      margin: 0;
      list-style: none;
    }
    .sidebar-nav a {
      display: block;
      padding: 6px 24px 6px 28px;
      font-size: 13.5px;
      color: var(--text-secondary);
      border-left: 3px solid transparent;
      transition: all .15s;
      text-decoration: none;
    }
    .sidebar-nav a:hover {
      color: var(--primary);
      background: #eef2f6;
      border-left-color: var(--primary-light);
    }
    .sidebar-nav a.active {
      color: var(--primary);
      border-left-color: var(--primary);
      font-weight: 600;
      background: var(--primary-bg);
    }

    /* Group header */
    .sidebar-group {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 13px 24px 5px 20px;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      transition: color .15s;
    }
    .sidebar-group:hover { color: var(--primary); }
    .sidebar-group .sidebar-icon {
      font-size: 8px;
      width: 14px;
      flex-shrink: 0;
      transition: transform .2s;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .sidebar-group .sidebar-group-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
    }
    .sidebar-group:hover .sidebar-group-dot { background: var(--primary); }

    /* Subnav items */
    .sidebar-subnav {
      padding: 0;
      margin: 0;
      overflow: hidden;
      transition: max-height .25s ease;
    }
    .sidebar-subnav.collapsed { max-height: 0; }
    .sidebar-subnav a {
      padding-left: 44px;
      font-size: 13px;
      position: relative;
    }
    .sidebar-subnav a::before {
      content: '';
      position: absolute;
      left: 32px;
      top: 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--sidebar-border);
      transform: translateY(-50%);
      transition: background .15s;
    }
    .sidebar-subnav a:hover::before,
    .sidebar-subnav a.active::before {
      background: var(--primary-light);
    }

    /* Search */
    .sidebar .search {
      padding: 10px 16px 6px;
      border-bottom: 1px solid var(--sidebar-border);
    }
    .sidebar .search input {
      width: 100%;
      border: 1px solid var(--sidebar-border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      background: #fff;
      transition: border-color .2s, box-shadow .2s;
    }
    .sidebar .search input:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(10,110,117,.1);
      outline: none;
    }

    /* === Content === */
    .content {
      left: var(--sidebar-width);
      padding-top: 0;
    }
    .markdown-section {
      max-width: var(--content-max-width);
      padding: 48px 64px 80px;
    }
    .markdown-section h1 {
      font-size: 2.1em;
      font-weight: 700;
      color: var(--primary-dark);
      margin-top: 0;
      padding-bottom: 10px;
      border-bottom: 3px solid var(--primary-bg);
    }
    .markdown-section h2 {
      font-size: 1.45em;
      font-weight: 600;
      color: var(--text);
      margin-top: 40px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--sidebar-border);
    }
    .markdown-section h3 {
      font-size: 1.1em;
      font-weight: 600;
      color: var(--text);
      margin-top: 28px;
    }
    .markdown-section h4 { font-size: 1em; font-weight: 600; color: var(--text); margin-top: 24px; }
    .markdown-section p { color: var(--text); line-height: 1.8; margin: 14px 0; }
    .markdown-section a { color: var(--primary); font-weight: 500; }
    .markdown-section a:hover { text-decoration: underline; }
    .markdown-section code {
      font-family: var(--font-mono);
      background: var(--code-bg);
      color: #1a365d;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: .87em;
    }
    .markdown-section pre {
      background: var(--code-bg);
      border-radius: 8px;
      padding: 18px 22px;
      border: 1px solid var(--sidebar-border);
      overflow-x: auto;
    }
    .markdown-section pre code {
      background: none;
      padding: 0;
      color: var(--text);
      font-size: .85em;
      line-height: 1.6;
    }
    .markdown-section blockquote {
      border-left: 4px solid var(--primary);
      background: var(--primary-bg);
      padding: 12px 22px;
      border-radius: 0 8px 8px 0;
      margin: 20px 0;
    }
    .markdown-section blockquote p { margin: 6px 0; }
    .markdown-section table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .markdown-section th {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      padding: 11px 16px;
      font-size: 13px;
      text-align: left;
    }
    .markdown-section td {
      padding: 10px 16px;
      border-bottom: 1px solid var(--sidebar-border);
      font-size: 14px;
    }
    .markdown-section tr:last-child td { border-bottom: none; }
    .markdown-section tr:nth-child(even) td { background: #f8fafc; }
    .markdown-section img { max-width: 100%; border-radius: 8px; }
    .markdown-section ul, .markdown-section ol { padding-left: 24px; }
    .markdown-section li { margin: 6px 0; }

    /* Copy button */
    .docsify-copy-code-button {
      background: var(--primary) !important;
      border-radius: 6px !important;
      font-size: 12px !important;
      padding: 4px 10px !important;
    }

    /* === Hamburger Toggle === */
    .sidebar-toggle {
      position: fixed;
      top: 14px;
      left: 16px;
      z-index: 200;
      width: 36px;
      height: 36px;
      border: none;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--text-secondary);
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      transition: all .2s;
    }
    .sidebar-toggle:hover {
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,.14);
    }
    .sidebar-toggle:active { transform: scale(.94); }
    .sidebar-toggle .icon-close { display: none; }
    .sidebar-toggle.open .icon-hamburger { display: none; }
    .sidebar-toggle.open .icon-close { display: inline; }

    /* Desktop: sidebar collapses via CSS custom property */
    body.sidebar-collapsed {
      --sidebar-width: 0px;
    }
    body.sidebar-collapsed .sidebar {
      overflow: hidden;
    }
    body.sidebar-collapsed .sidebar,
    body.sidebar-collapsed .content {
      transition-duration: .3s;
    }

    /* Sidebar transition for desktop toggle */
    .sidebar {
      transition: transform .3s ease, width .3s ease;
    }
    .content {
      transition: left .3s ease;
    }

    /* Backdrop (only used on mobile) */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 148;
      opacity: 0;
      transition: opacity .3s ease;
    }
    .sidebar-backdrop.visible {
      opacity: 1;
    }

    /* === Mobile Override === */
    /* Desktop: more subtle toggle */
    @media screen and (min-width: 769px) {
      .sidebar-toggle {
        top: 12px;
        left: 12px;
        width: 30px;
        height: 30px;
        font-size: 16px;
        background: transparent;
        box-shadow: none;
        opacity: .45;
      }
      .sidebar-toggle:hover { opacity: 1; background: var(--sidebar-bg); box-shadow: none; }
      body.sidebar-collapsed .sidebar-toggle { left: 16px; }
    }

    @media screen and (max-width: 768px) {
      .sidebar-toggle {
        top: 12px;
        left: 12px;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 280px;
        max-width: 85vw;
        z-index: 150;
        transform: translateX(-100%);
        overflow-y: auto;
        border-right: 1px solid var(--sidebar-border);
        transition: transform .3s ease;
        box-shadow: none;
      }
      body.sidebar-open .sidebar {
        transform: translateX(0);
        box-shadow: 4px 0 20px rgba(0,0,0,.12);
      }
      body.sidebar-open .sidebar-backdrop {
        display: block;
      }
      body.sidebar-open .sidebar-backdrop.visible {
        display: block;
      }

      .content { left: 0; }
      .markdown-section { padding: 56px 20px 24px; }
      .app-nav { right: 16px; top: 12px; }
    }
  </style>
</head>
<body>
  <nav class="app-nav">
    <a id="lang-en" href="#">EN</a>
    <a id="lang-zh" href="#">简体中文</a>
  </nav>
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
    <span class="icon-hamburger">☰</span>
    <span class="icon-close">✕</span>
  </button>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Sharkable',
      logo: './logo.jpg',
      repo: 'https://github.com/sharkableio/sharkable',
      loadSidebar: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: { '/zh-cn/': '搜索', '/': 'Type to search' },
        noData: { '/zh-cn/': '找不到结果', '/': 'No Results' },
        depth: 2,
        hideOtherSidebarContent: false,
        namespace: 'sharkableio.github.io',
        pathNamespaces: /^(\/(zh-cn|ru-ru))?(\/(v1|v2))?/,
      },
    }
  </script>
  <script>
    (function() {
      function switchLang(e) {
        e.preventDefault();
        var path = location.hash.replace(/^#\/?/, '') || '';
        var isZh = !!document.getElementById('lang-zh').classList.contains('active');
        var newPath;
        if (isZh) {
          newPath = path.replace(/^zh-cn\/?/, '').replace(/\/+$/, '');
          location.hash = newPath ? '#/' + newPath : '#/';
        } else {
          newPath = path.replace(/\/+$/, '');
          location.hash = newPath ? '#/zh-cn/' + newPath : '#/zh-cn/';
        }
      }
      document.getElementById('lang-en').addEventListener('click', switchLang);
      document.getElementById('lang-zh').addEventListener('click', switchLang);

      function updateLangActive() {
        var path = location.hash.replace(/^#\/?/, '');
        var isZh = path.startsWith('zh-cn/') || path === 'zh-cn';
        document.getElementById('lang-en').classList.toggle('active', !isZh);
        document.getElementById('lang-zh').classList.toggle('active', isZh);
      }
      updateLangActive();
      window.addEventListener('hashchange', updateLangActive);
    })();
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//unpkg.com/prismjs/components/prism-csharp.min.js"></script>
  <script src="//unpkg.com/docsify-copy-code"></script>
  <script>
    (function() {
      var DEFAULT_EXPANDED = true; // <-- change to false if you want sections collapsed by default

      function initSidebar() {
        var nav = document.querySelector('.sidebar-nav');
        if (!nav || nav.__shark) return;
        nav.__shark = true;

        var items = Array.from(nav.children).filter(function(el) { return el.tagName === 'LI'; });
        var groups = [];
        var current = null;

        items.forEach(function(li) {
          var strong = li.querySelector(':scope > strong');
          if (strong && li.childNodes.length < 2) {
            if (current) groups.push(current);
            current = { header: li, items: [] };
          } else if (current) {
            current.items.push(li);
          }
        });
        if (current) groups.push(current);

        groups.forEach(function(g) {
          if (g.items.length === 0) return;

          g.header.className = 'sidebar-group';
          var strong = g.header.querySelector(':scope > strong');

          var dot = document.createElement('span');
          dot.className = 'sidebar-group-dot';
          strong.parentNode.insertBefore(dot, strong);

          var icon = document.createElement('span');
          icon.className = 'sidebar-icon';
          icon.textContent = DEFAULT_EXPANDED ? '▼' : '▶';
          strong.parentNode.insertBefore(icon, strong);

          var subnav = document.createElement('ul');
          subnav.className = 'sidebar-subnav' + (DEFAULT_EXPANDED ? '' : ' collapsed');
          g.items.forEach(function(item) { subnav.appendChild(item); });
          g.header.parentNode.insertBefore(subnav, g.header.nextSibling);

          g.header.addEventListener('click', function(e) {
            if (e.target.closest('a')) return;
            var collapsed = subnav.classList.contains('collapsed');
            subnav.classList.toggle('collapsed');
            icon.textContent = collapsed ? '▼' : '▶';
          });
        });
      }

      var observer = new MutationObserver(function() {
        if (document.querySelector('.sidebar-nav li')) initSidebar();
      });
      observer.observe(document.body, { childList: true, subtree: true });

      function retry(t) { setTimeout(function() {
        if (!document.querySelector('.sidebar-nav') || !document.querySelector('.sidebar-nav').__shark) initSidebar();
      }, t); }
      retry(300); retry(800); retry(1500);
    })();
  </script>
  <script>
    (function() {
      var toggle = document.getElementById('sidebarToggle');
      var backdrop = document.getElementById('sidebarBackdrop');
      var body = document.body;

      function isMobile() { return window.innerWidth <= 768; }

      function openSidebar() {
        body.classList.add('sidebar-open');
        toggle.classList.add('open');
        backdrop.classList.add('visible');
        if (isMobile()) { document.body.style.overflow = 'hidden'; }
      }

      function closeSidebar() {
        body.classList.remove('sidebar-open');
        toggle.classList.remove('open');
        backdrop.classList.remove('visible');
        document.body.style.overflow = '';
      }

      function toggleSidebar() {
        if (isMobile()) {
          if (body.classList.contains('sidebar-open')) {
            closeSidebar();
          } else {
            openSidebar();
          }
        } else {
          body.classList.toggle('sidebar-collapsed');
        }
      }

      toggle.addEventListener('click', toggleSidebar);
      backdrop.addEventListener('click', closeSidebar);

      // Close sidebar when clicking a nav link (mobile)
      document.addEventListener('click', function(e) {
        var link = e.target.closest('.sidebar-nav a, .sidebar-nav a *');
        if (link && isMobile()) { closeSidebar(); }
      });

      // Close sidebar on Escape
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && body.classList.contains('sidebar-open')) { closeSidebar(); }
      });

      // Window resize: reset overflow on mobile->desktop transition
      window.addEventListener('resize', function() {
        if (!isMobile()) {
          document.body.style.overflow = '';
          closeSidebar();
        }
      });
    })();
  </script>
</body>
</html>
