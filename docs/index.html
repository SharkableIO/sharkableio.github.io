<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sharkable — Minimal API Framework for .NET</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Sharkable — A clean, powerful minimal API framework for .NET">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --primary: #0a6e75;
      --primary-light: #0d8a93;
      --primary-dark: #064e52;
      --primary-bg: #e8f4f5;
      --text: #1e293b;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --sidebar-bg: #fafbfc;
      --sidebar-border: #e2e8f0;
      --appbar-height: 56px;
      --sidebar-width: 280px;
      --content-max-width: 860px;
      --code-bg: #f1f4f8;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', 'PingFang SC', sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', 'Fira Mono', Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font);
      color: var(--text);
      line-height: 1.7;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      background: #fff;
    }

    /* === AppBar (Material Design) === */
    .app-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 500;
      height: var(--appbar-height);
      background: #fff;
      display: flex;
      align-items: center;
      padding: 0 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
      gap: 12px;
    }

    .app-bar .hamburger {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: var(--text-secondary);
      transition: background .15s;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .app-bar .hamburger:hover { background: rgba(0,0,0,.06); }
    .app-bar .hamburger:active { background: rgba(0,0,0,.1); }

    .app-bar .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 17px;
      flex-shrink: 0;
    }
    .app-bar .brand img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }

    .app-bar .spacer { flex: 1; }

    .app-bar .lang-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      padding: 0 12px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      border-radius: 16px;
      transition: all .2s;
      text-decoration: none;
      letter-spacing: .3px;
      flex-shrink: 0;
    }
    .app-bar .lang-btn:hover { color: var(--primary); background: var(--primary-bg); }
    .app-bar .lang-btn.active {
      color: #fff !important;
      background: var(--primary);
    }

    /* Hide docsify's default elements */
    .app-nav { display: none !important; }
    .sidebar-toggle { display: none !important; }
    .github-corner { display: none !important; }

    /* === Sidebar === */
    .sidebar {
      position: fixed;
      top: var(--appbar-height);
      left: 0;
      bottom: 0;
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      overflow-y: auto;
      z-index: 200;
      transition: width .25s ease;
    }
    .sidebar > h1 {
      display: none;
    }
    .sidebar .search {
      padding: 12px 16px 8px;
      border-bottom: 1px solid var(--sidebar-border);
    }
    .sidebar .search input {
      width: 100%;
      border: 1px solid var(--sidebar-border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      background: #fff;
      transition: border-color .2s, box-shadow .2s;
    }
    .sidebar .search input:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(10,110,117,.1);
      outline: none;
    }

    .sidebar-nav {
      padding: 8px 0 32px;
    }
    .sidebar-nav li { margin: 0; list-style: none; }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      padding: 10px 24px 10px 28px;
      margin: 2px 12px;
      font-size: 14px;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: 12px;
      transition: background .15s, color .15s;
    }
    .sidebar-nav a:hover {
      color: var(--primary);
      background: rgba(10,110,117,.06);
    }
    .sidebar-nav a.active {
      color: var(--primary-dark);
      background: var(--primary-bg);
      font-weight: 600;
    }

    /* Group header */
    .sidebar-group {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      text-align: center;
      gap: 6px;
      padding: 16px 8px 8px 8px;
      margin-top: 8px;
      border-top: 1px solid var(--sidebar-border);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: color .15s;
    }
    .sidebar-group:first-child { margin-top: 0; border-top: none; }
    .sidebar-group:hover { color: var(--primary); }

    .sidebar-group .sidebar-icon {
      font-size: 8px;
      flex-shrink: 0;
      color: var(--text-muted);
      transition: transform .2s;
      line-height: 1;
      opacity: .6;
    }
    .sidebar-group:hover .sidebar-icon { opacity: 1; color: var(--primary); }

    .sidebar-group .sidebar-group-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
      transition: background .15s, transform .15s;
    }
    .sidebar-group:hover .sidebar-group-dot {
      background: var(--primary);
      transform: scale(1.4);
    }

    /* Subnav items */
    .sidebar-subnav {
      padding: 0;
      margin: 0;
      overflow: hidden;
      transition: max-height .3s ease;
    }
    .sidebar-subnav.collapsed { max-height: 0; }
    .sidebar-subnav a {
      padding-left: 40px;
      font-size: 13.5px;
      border-radius: 12px;
      margin: 2px 12px;
    }

    /* === Content === */
    .content {
      position: relative;
      margin-top: var(--appbar-height);
      margin-left: var(--sidebar-width);
      transition: margin-left .25s ease;
      min-height: calc(100vh - var(--appbar-height));
      background: #fff;
    }
    .markdown-section {
      max-width: var(--content-max-width);
      padding: 40px 64px 80px;
    }
    .markdown-section h1 {
      font-size: 2.1em;
      font-weight: 700;
      color: var(--primary-dark);
      margin-top: 0;
      padding-bottom: 10px;
      border-bottom: 3px solid var(--primary-bg);
    }
    .markdown-section h2 {
      font-size: 1.45em;
      font-weight: 600;
      color: var(--text);
      margin-top: 40px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--sidebar-border);
    }
    .markdown-section h3 {
      font-size: 1.15em;
      font-weight: 600;
      color: var(--text);
      margin-top: 28px;
    }
    .markdown-section h4 { font-size: 1em; font-weight: 600; color: var(--text); margin-top: 24px; }
    .markdown-section p { color: var(--text); line-height: 1.8; margin: 14px 0; }
    .markdown-section a { color: var(--primary); font-weight: 500; }
    .markdown-section a:hover { text-decoration: underline; }
    .markdown-section code {
      font-family: var(--font-mono);
      background: var(--code-bg);
      color: #1a365d;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: .87em;
    }
    .markdown-section pre {
      background: var(--code-bg);
      border-radius: 8px;
      padding: 18px 22px;
      border: 1px solid var(--sidebar-border);
      overflow-x: auto;
    }
    .markdown-section pre code {
      background: none;
      padding: 0;
      color: var(--text);
      font-size: .85em;
      line-height: 1.6;
    }
    .markdown-section blockquote {
      border-left: 4px solid var(--primary);
      background: var(--primary-bg);
      padding: 12px 22px;
      border-radius: 0 8px 8px 0;
      margin: 20px 0;
    }
    .markdown-section blockquote p { margin: 6px 0; }
    .markdown-section table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .markdown-section th {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      padding: 11px 16px;
      font-size: 13px;
      text-align: left;
    }
    .markdown-section td {
      padding: 10px 16px;
      border-bottom: 1px solid var(--sidebar-border);
      font-size: 14px;
    }
    .markdown-section tr:last-child td { border-bottom: none; }
    .markdown-section tr:nth-child(even) td { background: #f8fafc; }
    .markdown-section img { max-width: 100%; border-radius: 8px; }
    .markdown-section ul, .markdown-section ol { padding-left: 24px; }
    .markdown-section li { margin: 6px 0; }

    .docsify-copy-code-button {
      background: var(--primary) !important;
      border-radius: 6px !important;
      font-size: 12px !important;
      padding: 4px 10px !important;
    }

    /* === Desktop sidebar collapse === */
    body.sidebar-collapsed .sidebar {
      width: 0;
      overflow: hidden;
    }
    body.sidebar-collapsed .content {
      margin-left: 0;
      padding-left: 64px;
    }

    /* === Mobile === */
    @media screen and (max-width: 768px) {
      .app-bar {
        padding: 0 8px;
      }

      .sidebar {
        position: fixed;
        top: var(--appbar-height);
        bottom: 0;
        width: 280px;
        max-width: 85vw;
        z-index: 300;
        transition: left .25s ease;
        box-shadow: none;
        left: -300px;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }
      body.sidebar-open .sidebar {
        left: 0;
        box-shadow: 4px 0 20px rgba(0,0,0,.12);
      }

      .content {
        margin-left: 0;
      }
      .markdown-section {
        padding: 24px 20px;
      }
      .sidebar-nav a {
        margin: 2px 4px;
        border-radius: 8px;
      }
      .sidebar-subnav a {
        margin: 2px 4px;
        border-radius: 8px;
      }
    }
  </style>
</head>
<body>
  <header class="app-bar">
    <button class="hamburger" id="sidebarToggle" aria-label="Toggle sidebar">
      <span class="icon-hamburger">☰</span>
    </button>
    <a class="brand" href="#/">
      <img src="./logo.jpg" alt="Sharkable">
      <span>Sharkable</span>
    </a>
    <span class="spacer"></span>
    <a id="lang-en" class="lang-btn" href="#">EN</a>
    <a id="lang-zh" class="lang-btn" href="#">简体中文</a>
  </header>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Sharkable',
      logo: './logo.jpg',
      loadSidebar: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: { '/zh-cn/': '搜索', '/': 'Type to search' },
        noData: { '/zh-cn/': '找不到结果', '/': 'No Results' },
        depth: 2,
        hideOtherSidebarContent: false,
        namespace: 'sharkableio.github.io',
        pathNamespaces: /^(\/(zh-cn|ru-ru))?(\/(v1|v2))?/,
      },
    }
  </script>
  <script>
    (function() {
      function switchLang(e) {
        e.preventDefault();
        var path = location.hash.replace(/^#\/?/, '') || '';
        var isZh = !!document.getElementById('lang-zh').classList.contains('active');
        var newPath;
        if (isZh) {
          newPath = path.replace(/^zh-cn\/?/, '').replace(/\/+$/, '');
          location.hash = newPath ? '#/' + newPath : '#/';
        } else {
          newPath = path.replace(/\/+$/, '');
          location.hash = newPath ? '#/zh-cn/' + newPath : '#/zh-cn/';
        }
      }
      document.getElementById('lang-en').addEventListener('click', switchLang);
      document.getElementById('lang-zh').addEventListener('click', switchLang);

      function updateLangActive() {
        var path = location.hash.replace(/^#\/?/, '');
        var isZh = path.startsWith('zh-cn/') || path === 'zh-cn';
        document.getElementById('lang-en').classList.toggle('active', !isZh);
        document.getElementById('lang-zh').classList.toggle('active', isZh);
      }
      updateLangActive();
      window.addEventListener('hashchange', updateLangActive);
    })();
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//unpkg.com/prismjs/components/prism-csharp.min.js"></script>
  <script src="//unpkg.com/docsify-copy-code"></script>
  <script>
    (function() {
      var DEFAULT_EXPANDED = true;

      function initSidebar() {
        var nav = document.querySelector('.sidebar-nav');
        if (!nav || nav.__shark) return;
        nav.__shark = true;

        var items = Array.from(nav.children).filter(function(el) { return el.tagName === 'LI'; });
        var groups = [];
        var current = null;

        items.forEach(function(li) {
          var strong = li.querySelector(':scope > strong');
          if (strong && li.childNodes.length < 2) {
            if (current) groups.push(current);
            current = { header: li, items: [] };
          } else if (current) {
            current.items.push(li);
          }
        });
        if (current) groups.push(current);

        groups.forEach(function(g) {
          if (g.items.length === 0) return;

          g.header.className = 'sidebar-group';
          var strong = g.header.querySelector(':scope > strong');

          var dot = document.createElement('span');
          dot.className = 'sidebar-group-dot';
          strong.parentNode.insertBefore(dot, strong);

          var icon = document.createElement('span');
          icon.className = 'sidebar-icon';
          icon.textContent = DEFAULT_EXPANDED ? '▼' : '▶';
          strong.parentNode.insertBefore(icon, strong);

          var subnav = document.createElement('ul');
          subnav.className = 'sidebar-subnav' + (DEFAULT_EXPANDED ? '' : ' collapsed');
          g.items.forEach(function(item) { subnav.appendChild(item); });
          g.header.parentNode.insertBefore(subnav, g.header.nextSibling);

          g.header.addEventListener('click', function(e) {
            if (e.target.closest('a')) return;
            var collapsed = subnav.classList.contains('collapsed');
            subnav.classList.toggle('collapsed');
            icon.textContent = collapsed ? '▼' : '▶';
          });
        });
      }

      var sidebarObserver = new MutationObserver(function() {
        if (document.querySelector('.sidebar-nav li')) initSidebar();
      });
      sidebarObserver.observe(document.body, { childList: true, subtree: true });

      function retry(t) { setTimeout(function() {
        if (!document.querySelector('.sidebar-nav') || !document.querySelector('.sidebar-nav').__shark) initSidebar();
      }, t); }
      retry(300); retry(800); retry(1500);
    })();
  </script>
  <script>
    (function() {
      var toggle = document.getElementById('sidebarToggle');
      var body = document.body;

      function isMobile() { return window.innerWidth <= 768; }

      function openSidebar() {
        body.classList.add('sidebar-open');
        if (isMobile()) { document.body.style.overflow = 'hidden'; }
      }

      function closeSidebar() {
        body.classList.remove('sidebar-open');
        document.body.style.overflow = '';
      }

      function toggleSidebar() {
        if (isMobile()) {
          if (body.classList.contains('sidebar-open')) {
            closeSidebar();
          } else {
            openSidebar();
          }
        } else {
          body.classList.toggle('sidebar-collapsed');
        }
      }

      toggle.addEventListener('click', function(e) { e.stopPropagation(); toggleSidebar(); });

      // Close sidebar when clicking outside it on mobile
      document.addEventListener('click', function(e) {
        if (isMobile() && body.classList.contains('sidebar-open')) {
          var sidebar = document.querySelector('.sidebar');
          if (sidebar && !sidebar.contains(e.target) && e.target !== toggle && !toggle.contains(e.target)) {
            closeSidebar();
          }
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && body.classList.contains('sidebar-open')) { closeSidebar(); }
      });

      window.addEventListener('resize', function() {
        body.classList.remove('sidebar-collapsed');
        if (!isMobile()) {
          document.body.style.overflow = '';
          closeSidebar();
        }
      });
    })();
  </script>
</body>
</html>
